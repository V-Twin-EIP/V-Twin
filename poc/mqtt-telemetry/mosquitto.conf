# Local Mosquitto broker for the V-Twin MQTT POC (#35). Loopback only, no secrets.
# The POC script starts the broker with this file and a temporary persistence directory.
# Anonymous access is acceptable for a loopback POC only; a deployed broker needs TLS and credentials.
listener 18830 127.0.0.1
allow_anonymous true
persistence true
persistence_file vtwin-poc.db
# Keep queued QoS 1 messages for a disconnected persistent session.
max_queued_messages 100000
log_type error
log_type warning
log_dest stderr
